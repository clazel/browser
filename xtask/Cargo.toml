[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Repository checker: runs and enforces docs/VERIFICATION.md. Build tooling, never shipped."

[dependencies]
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
serde_json = "1"
# Hashes for the digests in the generated conformance tables
# (xtask/src/testdata/hash.rs); class `tooling`/`test` in docs/DEPENDENCIES.md.
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
# GLSL to SPIR-V for `clazel-gpu`'s fixed shaders (xtask/src/shaders.rs); class
# `tooling` in docs/DEPENDENCIES.md. `wgsl-in` is unused but needed: naga 30.0.1
# does not build with `glsl-in` alone (its `front::interpolator` is gated on
# `spv-in` or `wgsl-in`, and the GLSL front end calls it).
naga = { version = "=30.0.1", default-features = false, features = ["glsl-in", "wgsl-in", "spv-out"] }

# Tooling, not browser code: Tier 0 by policy.
[package.metadata.clazel]
tier = 0
target-tier = 0
# Never part of the browser: may use `tooling` dependencies (docs/DEPENDENCIES.md).
tooling = true

[lints]
workspace = true

[package]
name = "clazel-gpu"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The GPU process's drawing (Phase 5 items 5.17b, 5.17c and 5.21a): a validated display list and a viewport to pixels, through fixed pipelines, with backends below a small trait; the driver blocklist and the crash policy; entering the sandbox on macOS and Linux; on Windows the host starts it confined."

[dependencies]
# The decoder and validator every list passes first (item 5.17a); our own crate.
clazel-displaylist = { path = "../clazel-displaylist" }
# The kernel's messages: `GpuViewport` in, `GpuReady`, `GpuRefused` and
# `FrameReady` out (item 5.18); our own crate.
clazel-ipc = { path = "../clazel-ipc" }

# Every foreign call of the Metal backend is in `clazel-sys` (CLAUDE.md rule 1).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
clazel-sys = { path = "../clazel-sys" }
# The GPU process's Seatbelt profile, as data (item 5.21a); our own crate.
clazel-sandbox = { path = "../clazel-sandbox" }

# Every foreign call of the Vulkan backend, and of entering the sandbox, is in
# `clazel-sys` (CLAUDE.md rule 1); the namespaces, Landlock rights and seccomp
# list are data from `clazel-sandbox` (item 5.21a).
[target.'cfg(target_os = "linux")'.dependencies]
clazel-sys = { path = "../clazel-sys" }
clazel-sandbox = { path = "../clazel-sandbox" }

# Every foreign call of the Direct3D 12 backend is in `clazel-sys` (CLAUDE.md
# rule 1), and so are the check that the process is in its AppContainer (the
# host starts it there, item 5.21a) and the inherited handles of its channels.
[target.'cfg(windows)'.dependencies]
clazel-sys = { path = "../clazel-sys" }

# The GPU process's sandbox entered for real (item 5.21a): the test runs itself
# again as a child, which must be on its main thread with no harness around it.
[[test]]
name = "sandbox_macos"
harness = false

# Verification tier (docs/VERIFICATION.md). The plan places this crate at tier 0
# (item 5.17b): a GPU driver is in its trusted base whatever is proven here. The
# Kani harnesses in src/proofs.rs are evidence for the batching and atlas
# arithmetic, not a tier claim.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

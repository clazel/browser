[package]
name = "clazel-web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The web platform's script-facing APIs: window, document and node APIs, events, timers, event loop, fetch and XHR, storage, history (phase-7.md items 7.13 to 7.17). So far the HTML serializer, the selector queries (querySelector, querySelectorAll, matches, closest) and DOM event dispatch; it also holds the vendored WPT tests and TodoMVC."

# The node tree the serializer (`src/serialize.rs`) reads (phase-7.md item
# 7.13). The rest of the implementation arrives with the items named in
# src/lib.rs.
[dependencies]
clazel-dom = { path = "../clazel-dom", version = "=0.0.0" }

# The selectors that `querySelector`, `querySelectorAll`, `matches` and
# `closest` match with (`src/selectors.rs`), and the parser's input limit.
clazel-selectors = { path = "../clazel-selectors", version = "=0.0.0" }
clazel-css = { path = "../clazel-css", version = "=0.0.0" }

# Item 7.15, the script half (`src/scripting/`): the engine through its
# embedding API (`clazel-js`, the one engine crate a browser crate names);
# the incremental parser (`clazel-treebuilder`'s `exec::incremental`) and
# the tokenizer's meta charset extraction (`clazel-html`); the script
# bodies' decoding and the MIME type checks (`clazel-encoding`,
# `clazel-mime`); script URLs (`clazel-url`) and `javascript:` URLs'
# percent-decoding (`clazel-percent`).
clazel-js = { path = "../clazel-js", version = "=0.0.0" }
clazel-treebuilder = { path = "../clazel-treebuilder", version = "=0.0.0" }
clazel-html = { path = "../clazel-html", version = "=0.0.0" }
clazel-encoding = { path = "../clazel-encoding", version = "=0.0.0" }
clazel-mime = { path = "../clazel-mime", version = "=0.0.0" }
clazel-url = { path = "../clazel-url", version = "=0.0.0" }
clazel-percent = { path = "../clazel-percent", version = "=0.0.0" }


# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today (the serializer and the selector queries, tested; nothing else yet); `target-tier` is what
# phase-7.md's "Crates" table sets.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

[package]
name = "clazel-text"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The text layout (Phase 4 item 4.14): a parsed document to a title, lines of at most a given width, and a numbered link list. HTML §15.3 decides which elements are hidden, blocks or preformatted; the rest is ours."

[dependencies]
# The node tree the layout reads (Phase 4 item 4.8).
clazel-dom = { path = "../clazel-dom" }

[dev-dependencies]
# The parser that builds the documents of the unit and golden tests
# (Phase 4 items 4.7 and 4.10).
clazel-treebuilder = { path = "../clazel-treebuilder", version = "=0.0.0" }

# Verification tier (docs/VERIFICATION.md). Tier 0: tests only. The policy's
# tier for layout is 0, and Phase 5 replaces this crate.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

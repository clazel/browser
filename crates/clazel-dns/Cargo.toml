[package]
name = "clazel-dns"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DNS message format (RFC 1035 §2.3, §3, §4; RFC 1034 §3.6.2; RFC 3596): query building, message decoding with name compression, answer extraction, and the nameserver lines of resolv.conf."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
# The resolv.conf parser reads IPv6 address literals with the URL
# Standard's IPv6 parser (URL §3.5), proven in clazel-url, rather than a
# second copy of it.
clazel-url = { path = "../clazel-url" }

# Test-only reference engine for the differential test in
# tests/conformance_dns.rs (class `test` in docs/DEPENDENCIES.md: never
# shipped). simple-dns parses and writes whole DNS messages and has one
# dependency (bitflags); dnsparse has none but reads only the header,
# questions and answers, and dns-parser has two and writes only queries.
[dev-dependencies]
simple-dns = "=0.12.0"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires.
[package.metadata.clazel]
tier = 2
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

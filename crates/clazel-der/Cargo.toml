[package]
name = "clazel-der"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ASN.1 DER (ITU-T X.690): a cursor-style decoder and an encoder for the types X.509 uses."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

# Test-only reference engine for the differential test in
# tests/conformance_der.rs (class `test` in docs/DEPENDENCIES.md: never
# shipped). Default features are off; `alloc` gives the owned types and
# `to_der`, `oid` the OBJECT IDENTIFIER type, so its only dependencies are `zeroize` and
# `const-oid`.
[dev-dependencies]
der = { version = "=0.8.2", default-features = false, features = ["alloc", "oid"] }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires.
[package.metadata.clazel]
tier = 2
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

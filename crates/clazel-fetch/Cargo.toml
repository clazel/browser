[package]
name = "clazel-fetch"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The HTTP client: from a URL to the request bytes (RFC 9112 §3.2.1, RFC 9110 §7.2) and from the response bytes to a result. Phase 3 item 3.6; for now the http:// GET with no redirects and no cookies."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
clazel-url = { path = "../clazel-url" }
clazel-http = { path = "../clazel-http" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires. Tier 0
# until 3.6 is complete (redirects, cookies, theorem_wire_cookies, the
# independent transcription, mutations and conformance).
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

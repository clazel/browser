[package]
name = "clazel-fetch"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The HTTP client: from a URL to the request bytes (RFC 9112 §3.2.1, RFC 9110 §7.2) and from the response bytes to a result, following redirects (Fetch §4.5). Phase 3 item 3.6; for now http:// only. Cookies are stored and sent from `clazel-cookie`'s jar."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
clazel-url = { path = "../clazel-url" }
clazel-http = { path = "../clazel-http" }
# Cookies (RFC 6265bis §5.7, §5.8 via Fetch §3.1): the jar, storage and
# retrieval are `clazel-cookie`'s; the origin of a URL and "same site" are
# `clazel-origin`'s, over `clazel-psl`'s list.
clazel-cookie = { path = "../clazel-cookie" }
clazel-origin = { path = "../clazel-origin" }
clazel-psl = { path = "../clazel-psl" }
# A `Location` value is UTF-8 decoded before the URL parser (transducer::real).
clazel-encoding = { path = "../clazel-encoding" }

[dev-dependencies]
# The reference engines of tests/conformance_differential.rs: rust-url (the
# WHATWG URL parser) resolves `Location` values, and the cookie jar of
# reqwest's `cookie_store` feature (RFC 6265) stores and sends cookies. As
# in `clazel-cookie`'s differential test: without default features (no
# Public Suffix List, no serde), and the same versions, so the Cargo.lock
# holds no new package (docs/DEPENDENCIES.md).
cookie_store = { version = "=0.21.1", default-features = false }
time = { version = "=0.3.17", default-features = false }
url = { version = "=2.5.8", default-features = false }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires. Tier 2:
# every proof passes, every mutation is a certified kill, and the conformance
# tests and the independent transcription pass (CLAUDE.md rule 7).
[package.metadata.clazel]
tier = 2
target-tier = 2
# The transducer's theorems (src/transducer/theorems.rs). `cargo xtask
# check` fails if one is not defined as a `proof fn` in this crate.
theorems = [
    "theorem_requests_bounded",
    "theorem_redirects_bounded",
    "theorem_url_changes_only_by_redirect",
    "theorem_sends_are_requests",
    "theorem_silent_until_decided",
    "theorem_split_invariant",
    "theorem_wire_cookies",
    "theorem_jar_frame",
    "theorem_ops_name_request",
    "theorem_jar_only_in_sends",
]

[package.metadata.verus]
verify = true

[lints]
workspace = true

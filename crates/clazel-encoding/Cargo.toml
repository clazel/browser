[package]
name = "clazel-encoding"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WHATWG Encoding Standard: labels, BOM sniff and decode, UTF-8, the single-byte encodings, UTF-16BE/LE, replacement and x-user-defined."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

# Test-only engines for the differential test in tests/conformance_utf8.rs
# (class `test` in docs/DEPENDENCIES.md: never shipped).
[dev-dependencies]
encoding_rs = "=0.8.35"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires. Tier 2:
# the UTF-8 decoder and encoder are proven to meet their contracts; each has
# a proven-equivalent independent transcription (Unicode Ch. 3); every
# mutation is certified killed; and both are tested against WPT encoding/,
# the standard library and encoding_rs (tests/conformance_utf8.rs).
[package.metadata.clazel]
tier = 2
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

[package]
name = "clazel-webidl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WebIDL bindings: generated bindings, WebIDL conversions, overload resolution, wrappers and DOMException (phase-7.md item 7.12), over clazel-js's public embedding API."

# The engine's embedding API, the one engine crate a browser crate names
# (phase-7.md, "The engine as a library").
[dependencies]
clazel-js = { path = "../clazel-js", version = "=0.0.0" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today (nothing: it is tested); `target-tier` is what
# phase-7.md's "Crates" table sets.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

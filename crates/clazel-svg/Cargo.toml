[package]
name = "clazel-svg"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Static SVG for exactly the two files Hacker News uses (Phase 6 item 6.11a): the elements svg and path, path commands M L H V Z, fill as hex, rasterized to RGBA8 behind clazel-image-shape's Decoder. Anything else is refused."

[dependencies]
clazel-image-shape = { path = "../clazel-image-shape" }

[dev-dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }

[package.metadata.clazel]
tier = 0
target-tier = 1

[lints]
workspace = true

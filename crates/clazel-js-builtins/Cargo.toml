[package]
name = "clazel-js-builtins"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The global object's built-ins (ECMA-262 clauses 19 to 28) for Clazel's JavaScript engine (phase-7.md item 7.9): Object, Function, the Error constructors, Symbol, iteration, Boolean, Number, String, Math, the global functions, Array and JSON."

[dependencies]
clazel-js-heap = { path = "../clazel-js-heap" }
clazel-js-number = { path = "../clazel-js-number" }
clazel-js-vm = { path = "../clazel-js-vm" }
clazel-json = { path = "../clazel-json" }

[dev-dependencies]
clazel-js-syntax = { path = "../clazel-js-syntax", version = "=0.0.0" }

# Verification tier (docs/VERIFICATION.md). Plain Rust with unit tests and a
# Test262 run through the interpreter (tests/); `target-tier` is 0, as the
# Crates table of phase-7.md states for this crate.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

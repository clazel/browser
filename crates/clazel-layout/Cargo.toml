[package]
name = "clazel-layout"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Layout (Phase 5): so far font matching (item 5.10), CSS Fonts 3 §5.2 and §5.4 over the font table of decision 5.0(c); shaping (item 5.11): characters to glyphs through cmap, hmtx advances and pair kerning, positioned in 26.6 fixed point; and white space and line breaking (item 5.12): CSS Text 3 §3 to §5 over UAX #14."

[dependencies]
# Faces, their names, OS/2 classes and cmap (Phase 5 item 5.9).
clazel-font = { path = "../clazel-font" }
# The computed `white-space`, `word-break` and `overflow-wrap` that white space
# processing and line breaking read (Phase 5 items 5.7 and 5.12).
clazel-style = { path = "../clazel-style" }

# The reference shaper of the shaping differential (tests/conformance_shaping.rs,
# phase-5.md item 5.11), never compiled into the browser.
[dev-dependencies]
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }

# Verification tier (docs/VERIFICATION.md). Tier 0: tests only. The policy's
# tier for layout is 0 (phase-5.md, "Crates").
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

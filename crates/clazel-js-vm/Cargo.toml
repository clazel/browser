[package]
name = "clazel-js-vm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The JavaScript engine's bytecode and its semantics for Clazel's Phase 7 browser (phase-7.md item 7.4): the instruction set, NaN-boxed values, and `spec fn step`."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
clazel-js-lexer = { path = "../clazel-js-lexer" }
clazel-js-syntax = { path = "../clazel-js-syntax" }
clazel-js-heap = { path = "../clazel-js-heap" }
clazel-js-number = { path = "../clazel-js-number" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today: nothing. The crate holds the specification of item 7.4
# and the compiler of item 7.7 (first and second slice, plain Rust: its evidence
# is unit tests and the Test262 sources it compiles, tests/); and the first
# slice of item 7.8, the interpreter loop and its first handlers (plain Rust:
# unit tests, a differential test against a transcription of `spec fn step`,
# and a Test262 run, tests/; Kani harnesses for its arithmetic and frame
# indexing, src/proofs.rs). `target-tier` is 0 for the shipped
# code, as the Crates table of phase-7.md states; the spec itself is written
# to Tier 2 standards (Verus checks it and the lemmas in src/lemmas.rs),
# because the JIT's front-end proofs (jit.md J.10) refine `step`.
[package.metadata.clazel]
tier = 0
target-tier = 0

[package.metadata.verus]
verify = true

[lints]
workspace = true

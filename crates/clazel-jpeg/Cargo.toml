[package]
name = "clazel-jpeg"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A baseline and progressive JPEG decoder (Phase 6 items 6.5 and 6.6): ITU-T T.81 sequential and progressive (Annex G) Huffman, the integer IDCT and fancy upsampling of libjpeg-turbo, JFIF and Adobe colour, EXIF orientation. A resumable step function over caller-owned buffers, implementing clazel-image-shape's Decoder."

[dependencies]
# The decoder interface (item 6.3), our own crate with no dependencies, so no
# third-party code is shipped (CLAUDE.md rule 8).
clazel-image-shape = { path = "../clazel-image-shape" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today; `target-tier` is the plan's reading of item 6.5: bytes of
# a page-chosen file drive every index and counter, so Tier 1 (Kani harnesses
# in src/proofs.rs: the bit reader, Huffman construction and decoding, the
# block machine, the IDCT, upsampling, orientation and the marker machine).
# The tier stays 0 until CI's full verification has run those harnesses green.
[package.metadata.clazel]
tier = 0
target-tier = 1

[lints]
workspace = true

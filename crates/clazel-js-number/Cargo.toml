[package]
name = "clazel-js-number"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ECMAScript Number conversions (phase-7.md item 7.11): StringToNumber, Number::toString, toFixed, toPrecision and toExponential, with our own big-integer arithmetic. BigInt parsing and printing are not here yet."

# No dependencies: the parsers and the arithmetic are ours (CLAUDE.md rule 8).
# The differential tests use Rust's own `f64` parsing and formatting.

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today (no Kani harness has run in CI for this crate yet, so
# nothing is claimed); `target-tier` is what phase-7.md's "Crates" table sets.
[package.metadata.clazel]
tier = 0
target-tier = 1

[lints]
workspace = true

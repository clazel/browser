[package]
name = "clazel-js-regexp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ECMAScript regular expressions: the pattern parser and early errors, and the backtracking matcher with a bounded stack, case folding and property tables (phase-7.md item 7.10)."

[dependencies]
# ID_Start and ID_Continue above U+007F, for group names (RegExpIdentifierStart
# and RegExpIdentifierPart, ECMA-262 §22.2.1†): the lexer's generated Unicode
# 18.0.0 tables, one copy of the data.
clazel-js-lexer = { path = "../clazel-js-lexer" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today; `target-tier` is what phase-7.md's "Crates" table sets.
# The parser and the matcher are written and tested (tests/), and
# src/parser/proofs.rs and src/proofs.rs hold Kani harnesses for pieces of
# them, but `tier` stays 0 until CI's full verification of them is green on a
# pull request (CLAUDE.md rule 7) and the gaps the README lists are closed.
[package.metadata.clazel]
tier = 0
target-tier = 1

[lints]
workspace = true

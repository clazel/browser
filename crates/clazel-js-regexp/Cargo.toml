[package]
name = "clazel-js-regexp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ECMAScript regular expressions: the pattern parser and its early errors (phase-7.md item 7.10, first half). The matcher and the Unicode tables are not written; the crate holds the vendored Unicode Character Database files."

[dependencies]
# ID_Start and ID_Continue above U+007F, for group names (RegExpIdentifierStart
# and RegExpIdentifierPart, ECMA-262 §22.2.1†): the lexer's generated Unicode
# 18.0.0 tables, one copy of the data.
clazel-js-lexer = { path = "../clazel-js-lexer" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today; `target-tier` is what phase-7.md's "Crates" table sets.
# The parser is written and tested (tests/), and src/parser/proofs.rs holds Kani
# harnesses for it, but `tier` stays 0 until CI's full verification of them is
# green on a pull request (CLAUDE.md rule 7), and the matcher, which the
# target tier also covers, does not exist.
[package.metadata.clazel]
tier = 0
target-tier = 1

[lints]
workspace = true

[package]
name = "clazel-css"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CSS parsing for Clazel's Phase 5 browser (phase-5.md items 5.2 to 5.7): CSS Syntax Level 3."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
clazel-encoding = { path = "../clazel-encoding" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today; `target-tier` is what the policy requires, since this will
# parse style sheets a page chose. The tokenizer is proven, but a tier also needs
# the parser, an independent transcription and full conformance.
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

[package]
name = "clazel-kernel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The browser kernel: a pure step function over renderers, cookies and Web Storage, and its isolation theorems."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
# The kernel decodes every frame itself (item 2.3), so the isolation theorems
# cover malformed input.
clazel-ipc = { path = "../clazel-ipc" }
# document.cookie is RFC 6265bis storage and retrieval with the non-HTTP API
# flag (item 2.9).
clazel-cookie = { path = "../clazel-cookie" }
# Origins are locks (item 2.5).
clazel-origin = { path = "../clazel-origin" }
# The cookie root, the isolation boundary (item 2.4).
clazel-psl = { path = "../clazel-psl" }
# Host and scheme types of the origins.
clazel-url = { path = "../clazel-url" }
# The transducer the kernel steps for a navigation (item 3.7): its spec
# `start` and `step`, and the real parsers it is joined to.
clazel-fetch = { path = "../clazel-fetch" }
# The response the transducer finishes with (`Action::Done`), which the
# mutation lemmas build, and its combined `Content-Type` field value (RFC 9110
# §5.2), which a commit carries (item 4.12).
clazel-http = { path = "../clazel-http" }
# A navigation URL arrives as UTF-8 text in a message (item 2.3) and is
# decoded to code points for the URL functions.
clazel-encoding = { path = "../clazel-encoding" }

[dev-dependencies]
# The reference engine of tests/conformance_differential.rs, as in
# `clazel-cookie`'s differential test: the cookie jar of reqwest's
# `cookie_store` feature, which follows RFC 6265. Without its default
# features (no Public Suffix List, no serde). Versions are those of
# `clazel-cookie`, so the Cargo.lock holds no new package.
cookie_store = { version = "=0.21.1", default-features = false }
time = { version = "=0.3.17", default-features = false }
url = { version = "=2.5.8", default-features = false }

# Verification tier (docs/VERIFICATION.md). Tier 2: the exec `step`
# (src/exec/) is proven to meet item 2.10's contract (src/contract.rs) for any
# implementation of the URL functions and of the fetch (item 3.7: the kernel
# steps item 3.6's transducer itself, with the parameters `FetchFns`; the
# shipped ones are `exec::real_urls::RealFetch`, `clazel-fetch`'s real
# response parser and URL functions, proven to implement `urls::real_fetch()`), and
# `exec::real_urls::RealUrls`, the
# real URL parser, is proven to implement `urls::real_urls()` (item 2.13); the
# mutations are certified kills (items 2.11 and 2.13); tests/conformance_*.rs run WPT cookies/ and webstorage/ and a
# cookie_store differential through the exec kernel; and src/independent.rs
# (the HTML Standard's document.cookie and Web Storage, written from the
# standard, proven equal to the spec on a stated class in
# src/independent_equivalence.rs) is the independent transcription.
[package.metadata.clazel]
tier = 2
target-tier = 2
# Item 2.11's isolation theorems. `cargo xtask check` fails if one is not
# defined as a `proof fn` in this crate, so a theorem cannot be quietly
# deleted to get a proof through.
theorems = [
    "theorem_reply_only_to_sender",
    "theorem_lock_is_committed_origin",
    "theorem_lock_is_committed_origin_state",
    "theorem_lock_set_only_by_navigation",
    "theorem_cookie_confidentiality",
    "theorem_cookie_integrity",
    "theorem_storage_same_origin",
    "theorem_cookie_noninterference",
    "theorem_cookie_noninterference_from",
    "theorem_cookie_noninterference_up_to_ids",
    "lemma_output_consistency",
    "lemma_step_consistency",
    "lemma_local_respect",
    "lemma_navigate_declassify",
    # Item 3.7: the kernel steps the fetch (`Net` events; `Connect`, `Send` and
    # `Close` outputs). The statements are in `statements.rs`; the proofs in
    # `net_theorems.rs`, `net_wf.rs`, `net_rel.rs`.
    "theorem_net_only_to_tab",
    "theorem_net_answers_connection",
    "theorem_wire_cookies",
    "theorem_net_jar_frame",
    "theorem_connection_ownership",
    "lemma_net_wf",
    "lemma_begin_navigation_wf",
    "lemma_apply_net_ops_wf",
    "lemma_apply_net_ops_agree",
    "lemma_begin_consistency",
    "lemma_net_consistency",
    "quark_tab_non_interference",
    "quark_cookie_integrity",
    "quark_cookie_confidentiality",
    "lemma_independent_cookie_get",
    "lemma_independent_cookie_set",
    "example_dead_tab_breaks_noninterference",
    "example_public_suffix_overlay_crosses_roots",
    "example_retrieval_changes_jar",
    # Item 2.13: the above for the shipped kernel (the real URL parser), and
    # the proof that its URL functions meet the exec step's precondition.
    "corollary_real_reply_only_to_sender",
    "corollary_real_lock_is_committed_origin",
    "corollary_real_cookie_confidentiality",
    "corollary_real_cookie_integrity",
    "corollary_real_storage_same_origin",
    "corollary_real_wire_cookies",
    "corollary_real_cookie_noninterference",
    "lemma_real_urls_resolve_scalar",
    # Phase 4 item 4.12: commits, bodies and display. The statements are in
    # `statements.rs`; the proofs in `display_theorems.rs`.
    "theorem_show_only_own_tab",
    "theorem_address_bar_integrity",
    "theorem_body_is_the_response",
]

[package.metadata.verus]
verify = true

[lints]
workspace = true

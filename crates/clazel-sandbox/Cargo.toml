[package]
name = "clazel-sandbox"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sandbox policies as data: seccomp-BPF generator, Landlock ruleset, namespaces, Seatbelt profile, Windows AppContainer."

# No dependencies: the crate generates and checks data and makes no system
# calls (applying the policies is item 2.15).

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires. Tier 1
# means Kani harnesses (src/proofs.rs).
[package.metadata.clazel]
tier = 1
target-tier = 1

[lints]
workspace = true

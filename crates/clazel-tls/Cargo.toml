[package]
name = "clazel-tls"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TLS 1.3 (RFC 8446) record layer and handshake message formats: the presentation language, records, handshake messages, extensions and alerts."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

# Test-only reference engine for the differential test in
# tests/conformance_tls_formats.rs (class `test` in docs/DEPENDENCIES.md:
# never shipped). Default features are off, so no cryptography provider is
# built; only the message codec of `rustls::internal::msgs` is used.
[dev-dependencies]
# Test-only SHA-256 oracle for RFC 8448 key-schedule vectors.
sha2 = { version = "=0.10.9", default-features = false }
rustls = { version = "=0.23.46", default-features = false }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires. Tier 2:
# the specs are proven through Verus, every mutation is a certified kill, the
# conformance suites (RFC 8448 vectors, the rustls differential) pass, and the
# clean-room transcription of RFC 8446 (`src/transcription/`) is proven
# equivalent to the specs end to end (`src/transcription_equivalence/`), each
# difference stated. CI's full verification on the raising pull request is
# the evidence.
[package.metadata.clazel]
tier = 2
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

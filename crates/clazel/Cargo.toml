[package]
name = "clazel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The kernel host shell: one socket pair and one sandboxed renderer process per tab, driven by the proven kernel step."

[dependencies]
# Starts a renderer and holds its channel (`launch`): a socket pair on Unix,
# an AppContainer and pipes on Windows.
clazel-renderer = { path = "../clazel-renderer" }
# `step_real`, the proven kernel step with the real URL parser (items 2.12
# and 2.13), and its state, event and output records.
clazel-kernel = { path = "../clazel-kernel" }
# Frames: `MAX_FRAME` and `payload_length`, and the message decoder the host
# uses to report what it carries.
clazel-ipc = { path = "../clazel-ipc" }
# `clazel fetch URL` (cli/fetch.rs): the network shell's http:// GET; and the
# resolver and connect the host carries the kernel's connections out with.
clazel-net = { path = "../clazel-net" }
# The network input of a `Net` event (`InputBuf`).
clazel-fetch = { path = "../clazel-fetch" }
# Item 5.23: the GPU process's surface socket (`channel`), the PNG and PPM of
# `browse --headless` take its pixels; the window (`clazel-window`) and the
# address bar's text (`clazel-font`, `clazel-layout`, `clazel-glyph-mask`),
# drawn by the command line in `cli/`. All our own crates.
clazel-gpu = { path = "../clazel-gpu" }
clazel-window = { path = "../clazel-window" }
clazel-font = { path = "../clazel-font" }
clazel-layout = { path = "../clazel-layout" }
clazel-glyph-mask = { path = "../clazel-glyph-mask" }

# The command line (`clazel URL SCRIPT`, `clazel demo`) is outside `src/`, whose
# line count the README reports: it only calls the host's public functions.
[[bin]]
name = "clazel"
path = "cli/main.rs"

# The conformance and adversarial tests (item 2.16) build their inputs with the
# workspace crates the kernel's own conformance tests use, and generate the
# hostile frames with the renderer crate.
[dev-dependencies]
clazel-cookie = { path = "../clazel-cookie", version = "=0.0.0" }
# The hostile pages of phase-4.md item 4.16 count the nodes and attributes
# of a parsed page to check the renderer's memory bound against them.
clazel-dom = { path = "../clazel-dom", version = "=0.0.0" }
clazel-origin = { path = "../clazel-origin", version = "=0.0.0" }
clazel-url = { path = "../clazel-url", version = "=0.0.0" }
# The TLS 1.3 server of tests/host.rs's `https:` navigation, configured as
# in clazel-net's tests/tls.rs (class `test`: never shipped; no new package).
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
# Item 5.23's tests build a display list and its reference pixels.
clazel-displaylist = { path = "../clazel-displaylist", version = "=0.0.0" }

# Item 5.23: a hand-built list's frame shown in a real window, which AppKit
# allows only on the main thread, so the test is its own `main`.
[[test]]
name = "browse_window"
harness = false

# Verification tier (docs/VERIFICATION.md). Tier 0: tests only. The shell is
# the I/O around the proven `step`; its line count is in the README table.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

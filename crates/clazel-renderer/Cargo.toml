[package]
name = "clazel-renderer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The renderer: enters the OS sandbox before reading a byte, then displays committed documents through the document pipeline (content type, encoding, HTML parser, text layout), or runs a script of document.cookie and localStorage operations over its socket."

[dependencies]
# The wire format: frames and messages (items 2.1 to 2.3).
clazel-ipc = { path = "../clazel-ipc" }
# The sandbox policies as data (item 2.14): the renderer applies them.
clazel-sandbox = { path = "../clazel-sandbox" }
# The only way into the OS sandbox (item 2.0). Safe functions; the renderer
# contains no `unsafe`.
clazel-sys = { path = "../clazel-sys" }
# The document pipeline (phase-4.md item 4.13), each step a function of the
# crate that proves it: the content type and MIME type sniffing (Phase 1),
# the encoding sniffing algorithm and the decoders (items 4.2, 4.3), the
# tokenizer and the tree builder (items 4.7, 4.10), the document base URL
# and link resolution (Phase 1), and the text layout (item 4.14, tier 0).
clazel-mime = { path = "../clazel-mime" }
clazel-encoding = { path = "../clazel-encoding" }
clazel-html = { path = "../clazel-html" }
clazel-dom = { path = "../clazel-dom" }
clazel-treebuilder = { path = "../clazel-treebuilder" }
clazel-url = { path = "../clazel-url" }
clazel-text = { path = "../clazel-text" }

# Verification tier (docs/VERIFICATION.md). Tier 0: tests only. The sandbox
# calls are audited (docs/SYS-AUDITS.md) and exercised by the integration
# tests of items 2.15 and 2.16; they cannot be proven.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

# The misbehaving renderer of item 2.16: hostile frames and sandbox escape
# attempts, run by the tests of `clazel` and of this crate.
[[bin]]
name = "clazel-adversary"
path = "src/adversary.rs"

# A test with its own `main`: it enters the real sandbox in a child process of
# its own, which a test harness (a thread per test) could not do on Linux.
[[test]]
name = "sandbox"
harness = false

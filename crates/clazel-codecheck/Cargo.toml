[package]
name = "clazel-codecheck"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The JIT's code validators (docs/phases/jit.md item J.6), the x86-64 one first: what an accepted code blob is, and the contract of the validator. Only the spec, the contract and examples exist so far; there is no validator yet."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
# The instruction subset the validator accepts, and its canonical encoding.
# The decoder of untrusted bytes is this crate's own (CLAUDE.md rule 8); the
# only thing taken from `clazel-x64` is the specification of the subset.
clazel-x64 = { path = "../clazel-x64" }
# The A64 subset and its proven encoder and decoder, for the A64 validator.
clazel-a64 = { path = "../clazel-a64" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today: nothing, because no validator exists yet (the spec, the
# contract and examples are written first, CLAUDE.md rule 3). `target-tier` is
# what jit.md's "Crates" table sets.
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

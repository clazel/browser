[package]
name = "clazel-a64"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The A64 (64-bit Arm) instruction-set subset the JIT emits (docs/phases/jit.md item J.4): semantics, encoder and decoder. The primary spec, the contracts, and the proven encoder and decoder exist; the independent transcription does not yet. It also holds the vendored instruction-set sources."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today, and it stays 0 here: the encoder and decoder are proven
# (Verus, in `src/encoder.rs`, `src/decoder.rs`, `src/inverse.rs`), but Tier 2
# also needs the mutation tests of that code, the conformance tests against
# official suites, and the independent transcription proven equivalent to the
# spec (jit.md J.4), none of which exist yet; the tier is raised only when
# `cargo xtask check` accepts all of them on a full CI run. `target-tier` is
# what jit.md's "Crates" table sets.
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

[dev-dependencies]
yaxpeax-arm = { version = "=0.5.0", default-features = false, features = ["fmt"] }
yaxpeax-arch = { version = "=0.3.3", default-features = false }

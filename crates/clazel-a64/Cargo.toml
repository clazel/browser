[package]
name = "clazel-a64"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The A64 (64-bit Arm) instruction-set subset the JIT emits (docs/phases/jit.md item J.4): semantics, encoder and decoder. Only the primary spec and the contracts exist so far; it also holds the vendored instruction-set sources."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today (nothing: the spec and the contracts are written, but no
# encoder or decoder exists, so there is no shipped code to prove);
# `target-tier` is what jit.md's "Crates" table sets. The contracts come first
# (rule 3).
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

[dev-dependencies]
yaxpeax-arm = { version = "=0.5.0", default-features = false, features = ["fmt"] }
yaxpeax-arch = { version = "=0.3.3", default-features = false }

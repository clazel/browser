[package]
name = "clazel-js-syntax"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The JavaScript parser for Clazel's Phase 7 browser (phase-7.md item 7.3): the AST, the specification of what a correct parse is (ECMA-262 section 13 onward, ASI, early errors) and the parser's contract."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
clazel-js-lexer = { path = "../clazel-js-lexer" }

# Verification tier (docs/VERIFICATION.md). Tier 0: this is the first half of
# item 7.3 (CLAUDE.md rule 3): the AST, the specification and the contract,
# with a few proven examples. There is no parser yet, so nothing about shipped
# code is proven. `target-tier` is 1 (phase-7.md, Crates).
[package.metadata.clazel]
tier = 0
target-tier = 1

[package.metadata.verus]
verify = true

[lints]
workspace = true

[package]
name = "clazel-js-heap"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The JavaScript engine's heap for Clazel's Phase 7 browser (phase-7.md item 7.5): NaN-boxed values, a generational index arena, Latin-1/UTF-16 strings with interned property keys, shapes, elements, symbols, and (item 7.6) the mark-and-sweep collector with weak references."

# No dependencies: the heap is ours end to end (CLAUDE.md rule 8), and it
# depends on no browser crate (phase-7.md, "The engine as a library").

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today: 0, because Kani's harnesses for the arena (src/proofs.rs)
# have not run in CI's full verification on a pull request yet; raising it is
# CI's call. `target-tier` is the plan's (phase-7.md, "Crates"): 1.
[package.metadata.clazel]
tier = 1
target-tier = 1

[lints]
workspace = true

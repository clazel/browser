[package]
name = "clazel-js-lexer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The JavaScript lexer for Clazel's Phase 7 browser (phase-7.md item 7.2): ECMA-262 section 12 source text to tokens, the goal symbol an input."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about the
# shipped code today; `target-tier` is what the policy requires, since this
# lexes scripts a page chose (phase-7.md 7.0(a)). Tier 0: the spec and the
# contracts are written (item 7.2, first half, CLAUDE.md rule 3), and the
# implementation (src/exec.rs) is proven total, panic-free and to tile its
# input, but not to agree with the spec: it does not meet src/contract.rs
# yet. The tier-2 evidence around the spec exists in part: an independent
# transcription of part of the grammar proven equal to the spec
# (src/independent.rs, src/equivalence.rs), 19 certified mutation kills
# (mutations.json) and Test262 conformance suites (tests/conformance_test262.rs).
# The tier stays 0 until the implementation is proven to meet the contract
# and CI's full verification passes.
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true

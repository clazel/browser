[package]
name = "clazel-dom"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The DOM node tree as an arena (DOM §4.2, §4.4 to §4.14, the parts the HTML parser uses; Infra §8 namespaces), its mutation algorithms and its well-formedness."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

[dev-dependencies]
# The independent engine of the differential test (`tests/conformance_dom.rs`,
# Phase 4 item 4.11): html5ever's reference-counted tree and the parser types it
# is built from. Test-only (docs/DEPENDENCIES.md, class `test`), at the
# versions `clazel-treebuilder` uses. markup5ever_rcdom's version is
# 0.39.0+unofficial; Cargo ignores the build metadata in a requirement.
html5ever = "=0.39.0"
markup5ever_rcdom = "=0.39.0"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires (Phase 4
# item 4.0, option A). Raised to 2 in the pull request that added
# `tests/conformance_dom.rs`; real only once that PR's full CI verification
# is green (proofs, mutations, conformance, Miri).
[package.metadata.clazel]
tier = 2
target-tier = 2
# Item 4.8's theorems (src/lemmas.rs). `cargo xtask check` fails if one is
# not defined as a `proof fn` in this crate.
theorems = [
    "theorem_new_document_wf",
    "theorem_create_node_wf",
    "theorem_create_template_contents_wf",
    "theorem_insert_wf",
    "theorem_append_wf",
    "theorem_insert_before_wf",
    "theorem_remove_wf",
    "theorem_reparent_children_wf",
    "theorem_append_data_wf",
    "theorem_append_attribute_wf",
    "theorem_set_mode_wf",
    "theorem_remove_keeps_record",
    "theorem_ids_stable",
    "theorem_create_template_contents_frame",
    "theorem_remove_keeps_order",
    "theorem_append_attribute_frame",
    "theorem_set_mode_frame",
    # Phase 7 item 7.13's theorems (src/ops_lemmas.rs).
    "theorem_change_attribute_wf",
    "theorem_remove_attribute_wf",
    "theorem_replace_attribute_wf",
    "theorem_adopt_wf",
    "theorem_clone_node_wf",
    "theorem_insert_any_wf",
    "theorem_pre_insert_wf",
    "theorem_replace_wf",
    "theorem_replace_all_wf",
    # The children rules of steps 5 and 6 (src/validity_lemmas.rs).
    "theorem_pre_insert_children_rules",
    "theorem_replace_children_rules",
    # Deep "clone a node" (src/deep_clone_lemmas.rs).
    "theorem_deep_copy_kind_fields",
    "theorem_deep_copy_children_facts",
    "theorem_deep_clone_leaf",
    # The size of a deep clone and when it may be refused
    # (src/deep_clone_size_lemmas.rs).
    "theorem_deep_clone_size",
    "theorem_deep_clone_grew",
    "theorem_clone_deep_refuses_exactly_when_full",
    "theorem_clone_deep_refused_only_if_full",
    "theorem_clone_deep_grew_means",
    "theorem_ranked_at_facts",
]

[package.metadata.verus]
verify = true

[lints]
workspace = true

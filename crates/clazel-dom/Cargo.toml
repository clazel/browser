[package]
name = "clazel-dom"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The DOM node tree as an arena (DOM §4.2, §4.4 to §4.14, the parts the HTML parser uses; Infra §8 namespaces), its mutation algorithms and its well-formedness."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

[dev-dependencies]
# The independent engine of the differential test (`tests/conformance_dom.rs`,
# Phase 4 item 4.11): html5ever's reference-counted tree and the parser types it
# is built from. Test-only (docs/DEPENDENCIES.md, class `test`), at the
# versions `clazel-treebuilder` uses. markup5ever_rcdom's version is
# 0.39.0+unofficial; Cargo ignores the build metadata in a requirement.
html5ever = "=0.39.0"
markup5ever_rcdom = "=0.39.0"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires (Phase 4
# item 4.0, option A). Tier 0 until CI's full verification is green on the
# proofs, mutations and the conformance evidence of item 4.11.
[package.metadata.clazel]
tier = 0
target-tier = 2
# Item 4.8's theorems (src/lemmas.rs). `cargo xtask check` fails if one is
# not defined as a `proof fn` in this crate.
theorems = [
    "theorem_new_document_wf",
    "theorem_create_node_wf",
    "theorem_create_template_contents_wf",
    "theorem_insert_wf",
    "theorem_append_wf",
    "theorem_insert_before_wf",
    "theorem_remove_wf",
    "theorem_reparent_children_wf",
    "theorem_append_data_wf",
    "theorem_append_attribute_wf",
    "theorem_set_mode_wf",
    "theorem_remove_keeps_record",
    "theorem_ids_stable",
]

[package.metadata.verus]
verify = true

[lints]
workspace = true

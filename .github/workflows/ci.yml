# Runs the checks in docs/VERIFICATION.md, in full, on every push to main,
# every manual run (Actions, "Run workflow", which needs write access to the
# repository) and every pull request. On a pull request the proofs (the
# `crate` jobs, which take hours) wait for a person to approve them: they
# need the `approval` job, which uses the `full-verification` environment,
# whose required reviewers are set in the repository's settings
# (Environments). Until one of them approves ("Review deployments" on the
# run), the proofs do not start and `Full verification` stays pending, so
# opening pull requests, however many, starts only the cheap jobs. Every push
# to a pull request starts a new run, which needs a new approval. The full
# verification is split into parts (xtask/src/parts.rs) so that no job comes
# near GitHub's six-hour limit:
#
#   crates    `cargo xtask check`, the fast static checks (unsafe, lint
#             overrides, escape hatches, tier declarations, pins, allowlist),
#             which fail in a minute or two so obvious mistakes show up early;
#             then the crate groups (`cargo xtask crates`) for the matrix
#             below, so a new crate cannot be left out.
#   approval  pull requests only, after `crates` passed: waits for a
#             reviewer of the `full-verification` environment to approve
#             the proof jobs, and does nothing else. It checks out no code.
#   base      `verify --part base`: static checks, rustfmt, clippy and tests
#             over the whole workspace.
#   base-windows the base part on Windows x86-64: the AppContainer sandbox
#             (renderer started confined by the host, escape tests), the
#             demo and the host tests, and the Windows-only code under clippy.
#             No setup.sh (it supports Linux and macOS): the base part needs
#             only the pinned Rust toolchain. Proofs, harnesses and Miri are
#             not repeated, as on macOS.
#   miri      `verify --part miri`: the workspace's tests under Miri.
#   base-macos the base part on macOS arm64: the Seatbelt sandbox, the demo,
#             the host and escape tests, and the macOS-only code under
#             clippy; then `verify --part miri clazel-sys`, the one crate with
#             macOS-only code that has tests Miri can run. The workspace is
#             not repeated under Miri there: Miri cannot run foreign calls, so
#             every sandbox test is ignored under it on both platforms, and
#             the rest is portable Rust that the `miri` job already
#             interprets with the same pinned nightly. Proofs and harnesses
#             are not repeated either: Verus and Kani give the same answer
#             for the same pinned versions on either platform.
#   crate     `verify --part crate <names>`: Kani, Verus, line counts,
#             mutations (several mutants at once, xtask/src/mutate.rs) and
#             conformance. One job per crate with proof work; the crates
#             with none share one job. Each uploads what it measured, one
#             file per crate, tagged with the commit. On a pull request,
#             only once `approval` passed.
#   assemble  `verify --part assemble`, the job named `Full verification`:
#             fails unless every job above passed (`approval` is skipped
#             outside pull requests), then checks that every crate's
#             measurements are present and from this commit, and reports
#             whether README.md's table matches them.
#   table     on pushes to main only, after `assemble` passed: writes
#             README.md's table from the same measurements
#             (`verify --part assemble --write`) and, if it changed, commits
#             it to main as github-actions[bot]. Changes therefore never need
#             to carry the table. It is the only job that may write to the
#             repository. Its push uses the workflow's own token, which starts
#             no new CI run. If main has moved on since the run started, it
#             commits nothing: the newer run updates the table instead.
#   release   `cargo build --release --locked` of the shipped binaries
#             (`clazel` and `clazel-renderer`) for Linux x86-64, uploaded as
#             a tarball with its SHA-256, with `install.sh` and the AppArmor
#             script it uses (packaging/). It is a build, not a check: the
#             binaries are only as verified as the commit's Full
#             verification says.
#
# Together the parts run exactly the checks of one `scripts/verify.sh`, which
# still runs them all on one machine. Verification has passed only when every
# job above is green; `assemble` cannot be, unless the others were. Every
# part exits non-zero when a tool is missing and checks were skipped, so a
# skipped check is never green.
#
# The crate parts run on Linux x86-64 only: it is the platform the
# Dockerfile reproduces, and Verus publishes no Linux arm64 build. macOS
# arm64 runs the base part (`base-macos`).
#
# Actions are pinned by commit SHA (the tag is in the trailing comment). Only
# setup.sh's download cache is cached: setup.sh re-checks every cached file
# against scripts/checksums.txt before using it, so a stale or tampered cache
# entry cannot reach the proof tools. Build output is never cached.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    name: Static checks and crate list
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install Rust
        run: rustup toolchain install
      - name: cargo xtask check
        run: cargo xtask check
      - id: list
        name: cargo xtask crates
        run: echo "list=$(cargo xtask crates)" >> "$GITHUB_OUTPUT"

  base:
    name: Verify (base)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/clazel-tools/downloads
          key: clazel-tools-${{ runner.os }}-${{ hashFiles('scripts/toolchains.env', 'scripts/checksums.txt') }}
      - name: Install pinned toolchain
        run: scripts/setup.sh
      # Ubuntu restricts unprivileged user namespaces through AppArmor; the
      # renderer's sandbox needs one and fails closed without it. Grant
      # `userns` to the programs that enter the sandbox in the tests, with
      # the same script the release installer uses.
      - name: Allow the sandbox's user namespace
        run: sudo packaging/apparmor/allow-userns.sh clazel-test "$GITHUB_WORKSPACE/target/{debug,release}/{clazel-renderer,clazel-adversary,deps/sandbox-*}"
      - name: Verify (base)
        run: cargo xtask verify --part base

  base-macos:
    name: Verify (base, macOS)
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/clazel-tools/downloads
          key: clazel-tools-${{ runner.os }}-${{ hashFiles('scripts/toolchains.env', 'scripts/checksums.txt') }}
      - name: Install pinned toolchain
        run: scripts/setup.sh
      # No AppArmor step: the renderer's macOS sandbox is Seatbelt, which an
      # unprivileged process enters without any setup.
      - name: Verify (base)
        run: cargo xtask verify --part base
      # Only clazel-sys under Miri: its macOS module is the only code that
      # compiles solely on macOS and has tests Miri can run (the checks made
      # before a foreign call). A workspace-wide run here took 84 minutes and
      # repeated the `miri` job, which made this the slowest job of the run;
      # this step builds one crate and runs three tests, so it needs no job
      # of its own (macOS runners are few, 5 at once).
      - name: Verify (Miri, clazel-sys)
        run: cargo xtask verify --part miri clazel-sys

  base-windows:
    name: Verify (base, Windows)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install Rust
        run: rustup toolchain install
      # No AppArmor step and no setup.sh. The renderer's sandbox is an
      # AppContainer that the host creates the process in; an unprivileged
      # user can do that. The tests grant the container read and execute on
      # the built binaries with icacls, and hash with certutil, both part of
      # Windows.
      - name: Verify (base)
        run: cargo xtask verify --part base

  miri:
    name: Verify (Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/clazel-tools/downloads
          key: clazel-tools-${{ runner.os }}-${{ hashFiles('scripts/toolchains.env', 'scripts/checksums.txt') }}
      - name: Install pinned toolchain
        run: scripts/setup.sh
      # No AppArmor step: tests that spawn the sandboxed renderer are
      # ignored under Miri.
      - name: Verify (Miri)
        run: cargo xtask verify --part miri

  approval:
    # The proofs take hours: on a pull request a reviewer of this
    # environment approves them first (see the header). One job holds the
    # approval, so one review starts every proof job of the run.
    name: Approve the proofs
    needs: crates
    if: github.event_name == 'pull_request'
    environment: full-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Approved
        run: echo "A reviewer approved the proof jobs for this run."

  crate:
    # A group of crates with no proofs is one job (`cargo xtask crates`).
    name: Verify ${{ contains(matrix.crate, ',') && 'crates without proofs' || matrix.crate }}
    needs: [crates, approval]
    # After an approval on a pull request; `approval` is skipped, and not
    # needed, everywhere else.
    if: >-
      ${{ !cancelled() && needs.crates.result == 'success' &&
      (needs.approval.result == 'success' ||
      (github.event_name != 'pull_request' && needs.approval.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      # Run every crate, so one failure does not hide another.
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.crates.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/clazel-tools/downloads
          key: clazel-tools-${{ runner.os }}-${{ hashFiles('scripts/toolchains.env', 'scripts/checksums.txt') }}
      - name: Install pinned toolchain
        run: scripts/setup.sh
      # Ubuntu restricts unprivileged user namespaces through AppArmor; the
      # renderer's sandbox needs one and fails closed without it. Grant
      # `userns` to the programs that enter the sandbox in the tests, with
      # the same script the release installer uses.
      - name: Allow the sandbox's user namespace
        run: sudo packaging/apparmor/allow-userns.sh clazel-test "$GITHUB_WORKSPACE/target/{debug,release}/{clazel-renderer,clazel-adversary,deps/sandbox-*}"
      - name: Verify ${{ matrix.crate }}
        run: cargo xtask verify --part crate "${{ matrix.crate }}" --metrics parts
      # One `<crate>.json` per crate of the job, all under parts/.
      - name: Upload measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-${{ matrix.crate }}
          path: parts/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Full verification
    needs: [crates, approval, base, base-macos, base-windows, miri, crate]
    # Runs even when a job it needs failed or was skipped, and fails then:
    # a skipped job is not a pass, and a skipped required check would count
    # as one. Only a cancelled run is not judged.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          # `approval` is skipped outside pull requests, and only there.
          bad=$(echo "$NEEDS" | jq -r --arg event "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "approval" or $event == "pull_request" or .value.result != "skipped")
            | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "Not every job passed:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Download measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Assemble
        run: cargo xtask verify --part assemble --metrics parts

  table:
    name: Update README table
    needs: assemble
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Commit the regenerated table to main.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Download measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Write the table
        run: cargo xtask verify --part assemble --metrics parts --write
      - name: Commit it
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md's table is up to date."
            exit 0
          fi
          # A newer push to main supersedes this run: its own table job
          # writes the table from its own measurements.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved on since $GITHUB_SHA; the newer run updates the table."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the README status table for ${GITHUB_SHA::12}" -- README.md
          git push origin HEAD:main

  release:
    name: Release build (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: cargo build --release
        run: cargo build --release --locked --bin clazel --bin clazel-renderer
      - name: Package
        run: |
          name="clazel-linux-x86_64-${GITHUB_SHA::12}"
          mkdir -p "dist/$name"
          mkdir -p "dist/$name/apparmor"
          cp target/release/clazel target/release/clazel-renderer LICENSE packaging/install.sh "dist/$name/"
          cp packaging/apparmor/allow-userns.sh "dist/$name/apparmor/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
